<input
  type="search"
  placeholder="Search for a country"
  [value]="query()"
  (input)="onSearch($event)"
/>

@if (loading()) {
  <p>Loading countries…</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else {
  <ul class="results">
    @for (country of filtered(); track country.code) {
      <li>
        <button type="button" (click)="select(country)">
          <img [src]="country.flag" alt="" width="24" />
          {{ country.name }}
        </button>
      </li>
    } @empty {
      <li>No countries found</li>
    }
  </ul>
}
