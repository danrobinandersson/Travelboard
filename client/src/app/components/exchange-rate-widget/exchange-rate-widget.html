<mat-card class="widget">
  <mat-card-header>
    <mat-card-title>Exchange rate</mat-card-title>
    @if (data()) {
      <mat-slide-toggle
        labelPosition="before"
        [checked]="showTable()"
        (change)="showTable.set($event.checked)"
      >
        Table
      </mat-slide-toggle>
    }
  </mat-card-header>
  <mat-card-content>

  @if (loading()) {
    <p>Loading...</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (data(); as rates) {
    <p class="key">
      1 {{ rates.base }} = <strong>{{ rates.latest.rate | number: '1.4-4' }}</strong>
      {{ rates.target }}
    </p>
    <p class="sub">As of {{ rates.latest.date }}</p>

    @if (showTable()) {
      <div class="visual">
        <ag-grid-angular class="grid" [rowData]="rates.history" [columnDefs]="columnDefs" />
      </div>
    } @else {
      <div echarts [options]="chartOptions()" class="visual"></div>
    }
  }
</mat-card-content>
</mat-card>
