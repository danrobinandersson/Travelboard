<section class="widget">
  <h2>Exchange rate</h2>

  @if (loading()) {
    <p>Loading...</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (data(); as rates) {
    <p class="latest">
      1 {{ rates.base }} = <strong>{{ rates.latest.rate | number: '1.4-4' }}</strong>
      {{ rates.target }}
    </p>
    <p class="date">As of {{ rates.latest.date }}</p>

    <mat-slide-toggle [checked]="showTable()" (change)="showTable.set($event.checked)">
      Toggle view
    </mat-slide-toggle>

    @if (showTable()) {
      <div class="grid-container">
        <ag-grid-angular class="grid" [rowData]="rates.history" [columnDefs]="columnDefs" />
      </div>
    } @else {
      <div echarts [options]="chartOptions()" class="chart"></div>
    }
  }
</section>
