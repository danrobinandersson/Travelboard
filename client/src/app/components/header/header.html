<header class="header">
  <a routerLink="/" class="logo" aria-label="Travelboard home">
    <img src="travelboard-logo-light.svg" alt="Travelboard" height="36" />
  </a>

  <nav>
    @if (auth.user(); as user) {
      <button
        matIconButton
        type="button"
        [matMenuTriggerFor]="accountMenu"
        matTooltip="Account"
        aria-label="Account menu"
      >
        <mat-icon>account_circle</mat-icon>
      </button>

      <mat-menu #accountMenu="matMenu">
        <span class="menu-email">{{ user.email }}</span>
        <a mat-menu-item routerLink="/favourites">
          <mat-icon>favorite</mat-icon>
          Favourites
        </a>
        <button mat-menu-item type="button" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Log out
        </button>
      </mat-menu>
    } @else if (auth.user() === null) {
      <a matIconButton routerLink="/login" matTooltip="Log in" aria-label="Log in">
        <mat-icon>login</mat-icon>
      </a>
    }
  </nav>
</header>
