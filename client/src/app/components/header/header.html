<header class="header">
  <h1>Travelboard</h1>
  <nav>
    <a routerLink="/">Home</a>
    @if (auth.user(); as user) {
      <a routerLink="/favourites">Favourites</a>
      <span class="email">{{ user.email }}</span>
      <button type="button" (click)="logout()">Log out</button>
    } @else if (auth.user() === null) {
      <a routerLink="/login">Log in</a>
    }
  </nav>
</header>
