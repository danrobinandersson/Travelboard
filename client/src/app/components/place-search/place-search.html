<div class="search">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Search a city in this country</mat-label>
    <input matInput #box type="search" (keyup.enter)="search(box.value)" />
  </mat-form-field>
  <button matButton="filled" type="button" (click)="search(box.value)">
    <mat-icon>search</mat-icon>
    Search
  </button>
</div>

@if (loading()) {
  <p>Searching...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (searched()) {
  @if (results().length === 0) {
    <p>No places found.</p>
  } @else {
    <ul class="results">
      @for (place of results(); track place.id) {
        <li>
          <button matButton="text" type="button" (click)="choose(place)">
            {{ place.region ? place.name + ', ' + place.region : place.name }}
          </button>
        </li>
      }
    </ul>
  }
}
