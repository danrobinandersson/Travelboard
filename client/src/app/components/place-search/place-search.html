<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>Search a city in this country</mat-label>
  <input matInput type="text" [value]="query()" (input)="onType($event)" [matAutocomplete]="auto" />
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayPlace"
    (optionSelected)="onOptionSelected($event)"
  >
    @if (loading()) {
      <mat-option disabled>Searching…</mat-option>
    } @else if (error()) {
      <mat-option disabled>{{ error() }}</mat-option>
    } @else if (searched() && results().length === 0) {
      <mat-option disabled>No places found</mat-option>
    } @else {
      @for (place of results(); track place.id) {
        <mat-option [value]="place">{{ label(place) }}</mat-option>
      }
    }
  </mat-autocomplete>
</mat-form-field>
