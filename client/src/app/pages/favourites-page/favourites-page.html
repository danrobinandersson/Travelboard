<h2>My favourites</h2>

@if (loading()) {
  <p>Loading...</p>
} @else if (error()) {
  <p class="error">{{ error() }}</p>
} @else if (favouriteCountries().length === 0) {
  <p>You have no favourites yet. Open a country and click Save.</p>
} @else {
  <div class="favourites-wrapper">
    @for (country of favouriteCountries(); track country.code) {
      <a [routerLink]="['/country', country.code]">
        <div class="favourite-card">
          <h3 class="favourite-name">{{ country.name }}</h3>
          <span
            matTooltip="Maximum of 3 countries reached"
            [matTooltipDisabled]="compare.has(country.code) || !compare.isFull()"
          >
            <button
              matIconButton
              type="button"
              [attr.aria-label]="
                compare.has(country.code)
                  ? 'Remove ' + country.name + ' from comparison'
                  : 'Add ' + country.name + ' to comparison'
              "
              [disabled]="!compare.has(country.code) && compare.isFull()"
              (click)="toggleCompare($event, country.code)"
            >
              <mat-icon>{{
                compare.has(country.code) ? 'playlist_add_check' : 'compare_arrows'
              }}</mat-icon>
            </button>
          </span>
          <button
            matIconButton
            type="button"
            [attr.aria-label]="'Remove ' + country.name + ' from favourites'"
            (click)="
              $event.preventDefault(); $event.stopPropagation(); favourites.remove(country.code)
            "
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </a>
    }
  </div>
}
